name: Prepare women's responsive WebP images

on:
  push:
    branches:
      - review/womens-collection-responsive-webp
    paths:
      - '.github/workflows/womens-webp-prep.yml'
      - 'scripts/prepare_womens_webp.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: review/womens-collection-responsive-webp
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --upgrade Pillow
      - name: Generate 960w WebP derivatives
        run: python scripts/prepare_womens_webp.py
      - name: Commit responsive images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/optimized/02_Apparel_and_Merchandise
          if git diff --cached --quiet; then
            echo "No new responsive images were needed."
          else
            git commit -m "Prepare responsive WebP images for women's collection"
            git push origin review/womens-collection-responsive-webp
          fi
