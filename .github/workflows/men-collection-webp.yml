name: Prepare men's collection WebP review
on:
  push:
    branches:
      - review/mens-collection-webp
    paths:
      - .github/workflows/men-collection-webp.yml
      - scripts/prepare_mens_webp.py
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/mens-collection-webp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip Pillow
      - run: python scripts/prepare_mens_webp.py
      - name: Commit optimized images and page references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mens-catalogue/*.webp mens-collection.html
          git commit -m "Optimize men's collection catalogue images as WebP"
          git push origin HEAD:review/mens-collection-webp
